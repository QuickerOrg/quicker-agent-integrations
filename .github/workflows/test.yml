name: Windows transport tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check plugin JSON
        run: |
          python -m json.tool .agents/plugins/marketplace.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool plugins/quicker/.codex-plugin/plugin.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool plugins/quicker/.mcp.json > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test transport, installation and release packaging
        run: python -m unittest discover -s tests -v
      - name: Build and verify every release package
        run: |
          $quickerCheckTag = "v0.0.0-ci.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          git tag $quickerCheckTag HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-release.py --tag $quickerCheckTag --output-dir .temp/release-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-release.py --tag $quickerCheckTag --output-dir .temp/release-ci --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
